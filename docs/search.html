<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search – RobloxHacksForums</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">Roblox<span>Hacks</span>Forums</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="forum.html">Forum</a></li>
        <li><a href="player.html">Player Lookup</a></li>
        <li><a href="search.html" class="active">Search</a></li>
      </ul>
      <form class="search-bar" id="global-search">
        <span class="icon">🔍</span>
        <input type="search" placeholder="Search…" aria-label="Search" />
      </form>
      <button class="hamburger" aria-label="Menu">☰</button>
    </div>
  </nav>

  <div class="container no-sidebar">
    <main class="main">
      <div class="page-header"><h1>Search</h1></div>
      <div class="card mb-2">
        <form id="search-form">
          <div class="form-group">
            <label for="search-q">Query (username, user ID, thread, exploit…)</label>
            <input id="search-q" type="search" placeholder="e.g. Roblox or ExampleExecutor" required />
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
      </div>
      <div id="search-results"></div>
    </main>
  </div>

  <footer class="footer">
    <p><strong>RobloxHacksForums is a fictional community/demo project.</strong></p>
    <p>Exploit compatibility results are simulated and should not be treated as verified security or compatibility information.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    (function () {
      const { loadData, lookupPlayer, showToast, statusBadge, escapeHtml, formatDate } = window.RHF;
      const form = document.getElementById('search-form');
      const results = document.getElementById('search-results');
      const input = document.getElementById('search-q');

      const q0 = new URLSearchParams(location.search).get('q');
      if (q0) { input.value = q0; doSearch(q0); }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (query) {
          history.replaceState(null, '', `?q=${encodeURIComponent(query)}`);
          doSearch(query);
        }
      });

      async function doSearch(query) {
        results.innerHTML = '<div class="card"><div class="skeleton skeleton-line medium"></div></div>';
        let html = '';
        const data = loadData();
        const q = query.toLowerCase();

        // Player
        try {
          const p = await lookupPlayer(
            /^\d+$/.test(query) ? { user_id: query } : { username: query }
          );
          html += '<h2 style="margin:1rem 0 0.5rem;font-size:1.1rem">Players (Roblox API)</h2>';
          html += `
            <div class="card player-card">
              <img class="player-avatar" src="${escapeHtml(p.avatar_url || '')}" alt="" onerror="this.style.display='none'">
              <div class="player-info">
                <h2>${escapeHtml(p.display_name || p.username)}</h2>
                <p><span class="label">Username:</span> ${escapeHtml(p.username)}</p>
                <p><span class="label">User ID:</span> ${escapeHtml(String(p.user_id))}</p>
                <p><a href="${escapeHtml(p.profile_url)}" target="_blank" rel="noopener">View Profile ↗</a></p>
              </div>
            </div>`;
        } catch (err) {
          if (err.status !== 404) {
            html += `<div class="card"><p class="text-muted">${escapeHtml(err.message || 'Roblox API unavailable')}</p></div>`;
          }
        }

        const threads = data.threads.filter(
          (t) =>
            t.title.toLowerCase().includes(q) ||
            (t.content || '').toLowerCase().includes(q) ||
            (t.tags || '').toLowerCase().includes(q) ||
            (t.author || '').toLowerCase().includes(q)
        );
        if (threads.length) {
          html += '<h2 style="margin:1rem 0 0.5rem;font-size:1.1rem">Threads</h2>';
          threads.forEach((t) => {
            html += `
              <a href="forum.html?id=${t.id}" class="card thread-card" style="display:grid;text-decoration:none;color:inherit">
                <div>
                  <div class="thread-title">${escapeHtml(t.title)}</div>
                  <div class="thread-meta">
                    <span>${escapeHtml(t.author)}</span>
                    <span>${escapeHtml(t.category)}</span>
                    <span>${formatDate(t.created_at)}</span>
                  </div>
                </div>
                <div class="thread-stats"><span>${t.views} views</span><span>${t.replies} replies</span></div>
              </a>`;
          });
        }

        const exploits = data.exploits.filter(
          (e) =>
            e.exploit_name.toLowerCase().includes(q) ||
            (e.supported_games || '').toLowerCase().includes(q)
        );
        if (exploits.length) {
          html += '<h2 style="margin:1rem 0 0.5rem;font-size:1.1rem">Exploits <span class="badge badge-demo">DEMO</span></h2>';
          exploits.forEach((e) => {
            html += `
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
                  <strong>${escapeHtml(e.exploit_name)}</strong>
                  ${statusBadge(e.simulated_status)}
                </div>
                <p class="text-muted" style="font-size:0.85rem">v${escapeHtml(e.version || '')} • ${escapeHtml(e.supported_games || '')}</p>
              </div>`;
          });
        }

        if (!html) html = '<div class="card text-center text-muted">No results found.</div>';
        results.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
